# Netlify preview deploy (Drop or linked site).
# Before public launch on this same site, remove robots noindex in index.html
# and loosen robots.txt + these headers.

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
